<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ZeroRpg</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <script type="module" src="./assets/index-DENWAaTq.js"></script>
    <link rel="stylesheet" href="./assets/index-B1TLBc35.css">
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="header-inner">
          <div class="header-titles">
            <h1>ZeroRpg</h1>
            <p class="subtitle" data-i18n="header.subtitle">放置文字冒险</p>
          </div>
          <div class="header-actions">
            <button id="btn-map" type="button" class="btn-icon header-panel-btn" data-i18n="btn.map" data-i18n-title="btn.map.title" data-i18n-aria="btn.map.title" title="地图" aria-label="地图">地图</button>
            <button id="btn-bestiary" type="button" class="btn-icon header-panel-btn" data-i18n="btn.bestiary" data-i18n-title="btn.bestiary.title" data-i18n-aria="btn.bestiary.title" title="怪物图鉴" aria-label="怪物图鉴">图鉴</button>
            <button id="btn-collectibles" type="button" class="btn-icon header-panel-btn" data-i18n="btn.collectibles" data-i18n-title="btn.collectibles.title" data-i18n-aria="btn.collectibles.title" title="藏品与料理" aria-label="藏品与料理">收集</button>
            <button id="btn-quests" type="button" class="btn-icon header-panel-btn header-quest-btn" data-i18n-title="btn.quests.title" data-i18n-aria="btn.quests.title" title="任务" aria-label="任务">
              <span data-i18n="btn.quests">任务</span><span id="quest-badge" class="header-badge" hidden></span>
            </button>
            <button id="btn-settings" type="button" class="btn-icon settings-btn" data-i18n-title="btn.settings.title" data-i18n-aria="btn.settings.title" title="设置" aria-label="设置">
              <svg class="icon-gear" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.05.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div id="settings-overlay" class="settings-overlay" hidden>
        <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <div class="settings-header">
            <h2 id="settings-title" data-i18n="settings.title">设置</h2>
            <button id="btn-settings-close" type="button" class="btn-icon settings-close" data-i18n-aria="settings.close" aria-label="关闭">×</button>
          </div>
          <div class="settings-body">
            <section class="settings-section" id="dev-settings-section" hidden>
              <h3 class="settings-section-title" data-i18n="settings.dev">开发者</h3>
              <button id="btn-open-dev-sandbox" type="button" class="settings-action" data-i18n="settings.dev.open" hidden>开发者测试台</button>
              <p id="dev-sandbox-hint" class="settings-hint" data-i18n="settings.dev.hint" hidden>发放任意物品、调整技能等级。需先在存档区勾选「开发者模式」或「瞬间完成」。</p>
            </section>
            <section class="settings-section">
              <h3 class="settings-section-title" data-i18n="settings.language">语言</h3>
              <select id="select-language" class="settings-select" data-i18n-aria="settings.language.aria" aria-label="语言">
                <option value="zh-CN" selected data-i18n="settings.langOptionZh">简体中文</option>
                <option value="en">English</option>
              </select>
            </section>
            <section class="settings-section">
              <h3 class="settings-section-title" data-i18n="settings.game">游戏</h3>
              <label class="checkbox-label">
                <input id="checkbox-pixel-ui" type="checkbox" checked />
                <span data-i18n="settings.game.pixelUi">像素风界面（关闭恢复原版）</span>
              </label>
              <button id="btn-hard-restart" type="button" class="settings-action danger" data-i18n="settings.game.hardRestart">硬重启（重置存档）</button>
              <p class="settings-hint" data-i18n="settings.game.hardRestart.hint">清除本地存档并从海滩重新开始，此操作不可撤销。</p>
            </section>
          </div>
        </div>
      </div>

      <div id="dev-sandbox-overlay" class="dev-sandbox-overlay" hidden>
        <div class="dev-sandbox-panel" role="dialog" aria-modal="true" aria-labelledby="dev-sandbox-title">
          <div class="dev-sandbox-header">
            <h2 id="dev-sandbox-title" data-i18n="dev.title">开发者测试台</h2>
            <button id="btn-dev-sandbox-close" type="button" class="btn-icon settings-close" data-i18n-aria="settings.close" aria-label="关闭">×</button>
          </div>
          <nav id="dev-sandbox-tabs" class="dev-sandbox-tabs"></nav>
          <div id="dev-sandbox-body" class="dev-sandbox-body"></div>
        </div>
      </div>

      <div id="storage-overlay" class="storage-overlay" hidden>
        <div class="storage-panel" role="dialog" aria-modal="true" aria-labelledby="storage-title">
          <div class="storage-header">
            <h2 id="storage-title" data-i18n="storage.title">储存箱</h2>
            <span id="storage-capacity-label" class="storage-capacity-label"></span>
            <button id="btn-storage-close" type="button" class="action-btn secondary" data-i18n="storage.exit">退出</button>
          </div>
          <nav id="storage-filter-bar" class="inv-filter-bar storage-filter-bar"></nav>
          <div class="storage-columns">
            <section class="storage-col">
              <h3 class="storage-col-title" data-i18n="storage.bag">背包</h3>
              <div id="storage-bag-list" class="storage-list"></div>
            </section>
            <section class="storage-col">
              <h3 class="storage-col-title"><span data-i18n="storage.box">储存箱</span> <span id="storage-box-cap" class="storage-col-cap"></span></h3>
              <div id="storage-box-list" class="storage-list"></div>
            </section>
          </div>
        </div>
      </div>

      <div id="world-map-overlay" class="game-panel-overlay" hidden>
        <div class="game-panel world-map-panel" role="dialog" aria-modal="true" aria-labelledby="world-map-title">
          <div class="game-panel-header">
            <h2 id="world-map-title" data-i18n="map.title">地图</h2>
            <button id="btn-world-map-close" type="button" class="btn-icon settings-close" data-i18n-aria="settings.close" aria-label="关闭">×</button>
          </div>
          <div id="world-map-body" class="game-panel-body world-map-body"></div>
        </div>
      </div>

      <div id="bestiary-overlay" class="game-panel-overlay" hidden>
        <div class="game-panel bestiary-panel" role="dialog" aria-modal="true" aria-labelledby="bestiary-title">
          <div class="game-panel-header">
            <h2 id="bestiary-title" data-i18n="bestiary.title">怪物图鉴</h2>
            <button id="btn-bestiary-close" type="button" class="btn-icon settings-close" data-i18n-aria="settings.close" aria-label="关闭">×</button>
          </div>
          <div id="bestiary-body" class="game-panel-body"></div>
        </div>
      </div>

      <div id="quests-overlay" class="game-panel-overlay" hidden>
        <div class="game-panel" role="dialog" aria-modal="true" aria-labelledby="quests-title">
          <div class="game-panel-header">
            <h2 id="quests-title" data-i18n="quests.title">任务</h2>
            <button id="btn-quests-close" type="button" class="btn-icon settings-close" data-i18n-aria="settings.close" aria-label="关闭">×</button>
          </div>
          <div id="quests-body" class="game-panel-body"></div>
        </div>
      </div>

      <div id="collectibles-overlay" class="game-panel-overlay" hidden>
        <div class="game-panel collectibles-panel" role="dialog" aria-modal="true" aria-labelledby="collectibles-title">
          <div class="game-panel-header">
            <h2 id="collectibles-title" data-i18n="collectibles.title">收集</h2>
            <button id="btn-collectibles-close" type="button" class="btn-icon settings-close" data-i18n-aria="settings.close" aria-label="关闭">×</button>
          </div>
          <div id="collectibles-body" class="game-panel-body"></div>
        </div>
      </div>

      <div id="interaction-overlay" class="game-panel-overlay interaction-overlay" hidden>
        <div class="game-panel interaction-panel" role="dialog" aria-modal="true" aria-labelledby="interaction-title">
          <div class="game-panel-header interaction-header">
            <span id="interaction-kind" class="interaction-kind-badge" data-i18n="interaction.kind" hidden>交互</span>
            <h2 id="interaction-title" data-i18n="interaction.title">交互</h2>
            <button type="button" id="btn-interaction-close" class="btn-icon settings-close" data-i18n-aria="settings.close" aria-label="关闭">×</button>
          </div>
          <div id="interaction-body" class="game-panel-body interaction-body"></div>
          <div id="interaction-footer" class="interaction-footer" hidden>
            <span class="interaction-footer-hint" data-i18n="interaction.footer.hint">择一而行</span>
          </div>
        </div>
      </div>

      <div id="hero-profile-overlay" class="game-panel-overlay hero-profile-overlay" hidden>
        <div class="game-panel hero-profile-panel" role="dialog" aria-modal="true" aria-labelledby="hero-profile-title">
          <div class="game-panel-header">
            <h2 id="hero-profile-title" data-i18n="hero.title">称呼与头衔</h2>
            <button id="btn-hero-profile-close" type="button" class="btn-icon settings-close" data-i18n-aria="settings.close" aria-label="关闭">×</button>
          </div>
          <div id="hero-profile-body" class="game-panel-body hero-profile-body">
            <div class="hero-profile-section hero-profile-name-section">
              <label class="hero-profile-label" for="hero-profile-name-input" data-i18n="hero.name">称呼</label>
              <input type="text" id="hero-profile-name-input" class="hero-profile-name-input" maxlength="20" autocomplete="off" spellcheck="false" />
            </div>
            <div id="hero-profile-titles-mount" class="hero-profile-section">
              <div class="hero-profile-label-row">
                <span class="hero-profile-label" data-i18n="hero.titles">装备头衔</span>
                <span class="hero-profile-hint" data-i18n="hero.titles.hint">0/5 · 提供属性加成，显示在姓名前</span>
              </div>
              <div id="hero-profile-total" class="hero-profile-total"></div>
              <div id="hero-profile-title-list" class="hero-title-list"></div>
            </div>
          </div>
          <div class="hero-profile-footer">
            <button id="btn-hero-profile-save" type="button" class="action-btn primary" data-i18n="hero.save">保存</button>
            <button id="btn-hero-profile-cancel" type="button" class="action-btn secondary" data-i18n="hero.cancel">取消</button>
          </div>
        </div>
      </div>

      <div class="main-grid">
        <aside class="col-left">
          <section class="panel left-hero-panel">
            <div id="char-bars"></div>
            <div id="status-effects-panel" class="status-effects-panel"></div>
            <div class="left-char-head">
              <nav id="left-char-tabs" class="left-sub-tabs"></nav>
              <button type="button" id="left-char-fold" class="left-char-fold-btn" data-left-char-fold data-i18n-title="left.fold.title" title="折叠属性/装备/工具" aria-expanded="true">▾</button>
            </div>
            <div id="left-char-pane"></div>
          </section>
          <section class="panel inv-panel">
            <h2 class="inv-panel-title" data-i18n="inv.title">背包</h2>
            <nav id="inv-filter-bar" class="inv-filter-bar"></nav>
            <div id="inventory-list" class="inventory-list"></div>
          </section>
        </aside>

        <main class="col-center">
          <section class="panel location-panel">
            <div id="location-info"></div>
            <div id="combat-info" class="combat-block"></div>
          </section>
          <section class="panel activity-panel">
            <div id="current-activity" class="current-activity"></div>
            <nav class="tab-bar" id="tab-bar"></nav>
            <div id="tab-content" class="tab-content"></div>
          </section>
        </main>

        <aside class="col-right">
          <section class="panel log-panel">
            <div class="log-header">
              <h2 data-i18n="log.title">消息日志</h2>
              <button id="btn-clear-log" type="button" class="btn-sm" data-i18n="log.clear">清空</button>
            </div>
            <nav id="log-filter-bar" class="inv-filter-bar log-filter-bar" data-i18n-title="log.filter.title" title="点击切换显示/隐藏该类型"></nav>
            <div id="message-log" class="message-log"></div>
          </section>
          <div id="craft-queue-hud" class="craft-queue-hud" hidden></div>
          <div id="skill-growth-hud" class="skill-growth-hud" hidden></div>
          <section class="panel save-panel">
            <h2 data-i18n="save.title">存档</h2>
            <div class="save-controls">
              <button id="btn-export" type="button" class="btn-sm" data-i18n="save.export">导出</button>
              <label class="import-label btn-sm">
                <span data-i18n="save.import">导入</span>
                <input id="input-import" type="file" accept=".zerpg,.json,application/json" hidden />
              </label>
              <label class="checkbox-label">
                <input id="checkbox-autosave" type="checkbox" checked />
                <span data-i18n="save.autosave">自动保存</span>
              </label>
              <div id="dev-save-options" hidden>
              <label class="checkbox-label" data-i18n-title="save.devMode.title" title="显示未解锁内容；制作/建造免材料且无需领悟配方与设施">
                <input id="checkbox-spoilers" type="checkbox" />
                <span data-i18n="save.devMode">开发者模式 / 显示隐藏（测试）</span>
              </label>
              <label class="checkbox-label" data-i18n-title="save.instant.title" title="读条跳过等待（每轮只完成一次）；亦启用免材料制作">
                <input id="checkbox-instant-test" type="checkbox" />
                <span data-i18n="save.instant">瞬间完成（测试）</span>
              </label>
              </div>
            </div>
          </section>
        </aside>
      </div>
    </div>
<!--客服 开始-->

  </body>
